 <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Formulario de registro de usuarios de NovaWeb.">
    <title>Registro | NovaWeb</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="site-header">
        <nav class="navbar">
            <a href="index.html" class="brand">
                <img src="logo.usuario.png" alt="Logo de logo.registro usuario" class="logo">
                <span>logo.registrousuario</span>
            </a>

            <div class="nav-links">
                <a href="Index.html" class="nav-link">Inicio</a>
                <a href="Registro.html" class="nav-link active"
                   aria-current="page">Registrarse</a>
            </div>
        </nav>
    </header>

    <main class="main-content">
        <section class="form-card">
            <div class="card-icon" aria-hidden="true">LU</div>

            <h1>Crear una cuenta</h1>
            <p class="subtitle">
                Completa tus datos para registrarte en NovaWeb.
            </p>

            <form onsubmit="event.preventDefault(); alert('Función de registro no implementada. Este formulario es una demostración académica.');">

                <div class="form-group">
                    <label for="nombre">Nombre completo</label>
                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        placeholder="Escribe tu nombre completo"
                        autocomplete="name"
                        required>
                </div>

                <div class="form-group">
                    <label for="correo">Correo electrónico</label>
                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        placeholder="ejemplo@correo.com"
                        autocomplete="email"
                        required>
                </div>

                <div class="form-group">
                    <label for="contrasena">Crear contraseña</label>
                    <input
                        type="password"
                        id="contrasena"
                        name="contrasena"
                        placeholder="Crea una contraseña"
                        autocomplete="new-password"
                        minlength="6"
                        required>
                    <small class="field-help">
                        Utiliza al menos 6 caracteres.
                    </small>
                </div>

                <button type="submit" class="btn btn-primary">
                    Registrar
                </button>

                <p class="form-note">
                    ¿Ya tienes una cuenta?
                    <a href="Index.html">Iniciar sesión</a>
                </p>
            </form>
        </section>
    </main>

    <footer class="site-footer">
        <p>NovaWeb | Proyecto académico de HTML5 y CSS</p>
        <p>2026 · Desarrollado como práctica de Ingeniería Web</p>
    </footer>

</body>
</html>
