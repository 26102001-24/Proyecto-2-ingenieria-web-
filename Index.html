
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Proyecto académico de inicio de sesión y registro con HTML y CSS.">
    <title>Inicio de sesión | NovaWeb</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="site-header">
        <nav class="navbar">
            <a href="Index.html" class="brand">
                <img src="logo.usuario.png" alt="Logo de logo.usuario" class="logo">
                <span>logo.usuario</span>
            </a>

            <div class="nav-links">
                <a href="Index.html" class="nav-link active"
                   aria-current="page">Inicio</a>
                <a href="Registro.html" class="nav-link">Registrarse</a>
            </div>
        </nav>
    </header>

    <main class="main-content">
        <section class="form-card">
            <div class="card-icon" aria-hidden="true">LU</div>

            <h1>¡Bienvenido!</h1>
            <p class="subtitle">
                Ingresa tus datos para acceder a tu cuenta.
            </p>

            <form onsubmit="event.preventDefault(); alert('Inicio de sesión simulado. Esta versión no verifica usuarios reales.');">

                <div class="form-group">
                    <label for="usuario">Nombre de usuario</label>
                    <input
                        type="text"
                        id="usuario"
                        name="usuario"
                        placeholder="Ej. camilo123"
                        autocomplete="username"
                        required>
                </div>

                <div class="form-group">
                    <label for="contrasena">Contraseña</label>
                    <input
                        type="password"
                        id="contrasena"
                        name="contrasena"
                        placeholder="Ingresa tu contraseña"
                        autocomplete="current-password"
                        required>
                </div>

                <button type="submit" class="btn btn-primary">
                    Entrar
                </button>

                <p class="form-note">
                    ¿Todavía no tienes una cuenta?
                    <a href="Registro.html">Crear cuenta</a>
                </p>
            </form>
        </section>
    </main>

    <footer class="site-footer">
        <p>NovaWeb | Proyecto académico de HTML5 y CSS</p>
        <p>2026 · Desarrollado como práctica de Ingeniería Web</p>
    </footer>

</body>
</html>
